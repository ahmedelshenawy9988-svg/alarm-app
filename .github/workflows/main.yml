name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q -o ./*.zip -d project

      - name: Find project root
        id: root
        run: |
          SETTINGS=$(find project -name "settings.gradle*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle NOT FOUND"
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Create debug keystore
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarm-apk
          path: project/**/build/outputs/apk/debug/*.apk
